<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Page Flipper">
  <meta name="theme-color" content="#1d1b19">
  <title>Page Flipper</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Library: list of pieces -->
  <section id="library" class="view">
    <header class="bar">
      <h1>Page Flipper</h1>
      <button id="newPieceBtn" class="primary">+ New piece</button>
    </header>
    <div id="pieceGrid" class="grid"></div>
    <p id="emptyLibrary" class="empty" hidden>
      No music yet. Tap <b>+ New piece</b>, then photograph each page in order.
    </p>
  </section>

  <!-- Editor: one piece and its pages -->
  <section id="editor" class="view" hidden>
    <header class="bar">
      <button id="editorBack" class="ghost">‹ Library</button>
      <input id="pieceTitle" class="title-input" type="text" placeholder="Piece name" autocomplete="off">
      <button id="teachBtn">🎹 Teach turns</button>
      <button id="playBtn" class="primary">▶ Play</button>
    </header>
    <div class="actions">
      <label class="button">
        📷 Take photo
        <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
      </label>
      <label class="button">
        🖼 Choose photos
        <input id="libraryInput" type="file" accept="image/*" multiple hidden>
      </label>
    </div>
    <ol id="pageList" class="pages"></ol>
    <p id="emptyPieces" class="empty" hidden>
      Add the first page. Lay it flat in good light and fill the frame.
    </p>
    <div class="danger-zone">
      <button id="deletePieceBtn" class="danger ghost">Delete this piece</button>
    </div>
  </section>

  <!-- Crop: drag the four corners onto the page -->
  <section id="crop" class="view dark" hidden>
    <header class="bar">
      <button id="cropCancel" class="ghost">Cancel</button>
      <span id="cropHint" class="hint">Drag the corners onto the page edges</span>
      <button id="cropSave" class="primary">Save page</button>
    </header>
    <div id="cropStage" class="crop-stage">
      <canvas id="cropCanvas"></canvas>
    </div>
    <footer class="bar">
      <button id="rotateBtn" class="ghost">⟳ Rotate</button>
      <button id="resetCornersBtn" class="ghost">Reset corners</button>
      <span class="toggles">
        <label class="toggle"><input id="enhanceToggle" type="checkbox"> Clean up</label>
        <label class="toggle"><input id="colorToggle" type="checkbox" checked> Remove colored marks</label>
      </span>
    </footer>
    <div id="busy" class="busy" hidden><div class="spinner"></div><span>Straightening…</span></div>
  </section>

  <!-- Teach: record the last bar of each page -->
  <section id="teach" class="view teach" hidden>
    <header class="bar">
      <button id="teachBack" class="ghost">‹ Pages</button>
      <h2 id="teachTitle">Teach page turns</h2>
      <span class="spacer"></span>
    </header>
    <div class="teach-body">
      <div class="teach-page"><img id="teachImg" alt=""></div>
      <div class="teach-panel">
        <div class="teach-nav">
          <button id="teachPrev" aria-label="Previous page">◀</button>
          <div>
            <div id="teachWhich" class="teach-which"></div>
            <div id="teachState" class="teach-state"></div>
          </div>
          <button id="teachNext" aria-label="Next page">▶</button>
        </div>
        <p id="teachHelp" class="teach-help"></p>
        <button id="recordBtn" class="record">● Record</button>
        <div class="meter"><div id="levelBar" class="meter-fill"></div></div>
        <canvas id="chromaCanvas" class="chroma"></canvas>
        <div id="testBox" class="test-box" hidden>
          <div class="match-label">Match <span id="matchPct">0%</span></div>
          <div class="meter match"><div id="matchBar" class="meter-fill"></div><div id="matchLine" class="meter-line"></div></div>
          <div id="matchHit" class="match-hit">Would turn the page now ✓</div>
        </div>
        <div class="teach-actions">
          <button id="testBtn" disabled>👂 Test</button>
          <button id="forgetBtn" class="ghost danger" disabled>Forget this one</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Viewer: full-screen pages -->
  <section id="viewer" class="view viewer" hidden>
    <div id="spread" class="spread"></div>
    <div id="viewerChrome" class="viewer-chrome">
      <button id="viewerClose" class="ghost">‹ Done</button>
      <span id="viewerTitle"></span>
      <button id="earlyBtn" class="ghost">Turn: on last note</button>
      <button id="autoBtn" class="ghost">🎹 Auto-turn: on</button>
      <button id="layoutBtn" class="ghost">Layout</button>
    </div>
    <div id="pageBadge" class="page-badge"></div>
    <div id="autoDot" class="auto-dot" hidden><span class="dot"></span><span id="autoText"></span></div>
  </section>

  <div id="toast" class="toast" hidden></div>

  <script src="listen.js"></script>
  <script src="app.js"></script>
</body>
</html>
